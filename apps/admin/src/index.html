<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17352f" />
    <title>Sweet Spot Admin</title>
    <style>
      /*__SWEET_SPOT_STYLES__*/
    </style>
  </head>
  <body>
    <div id="fatal-error" class="fatal-error" role="alert" hidden></div>
    <script>
      window.addEventListener('error', function (event) {
        var message = event.error && event.error.message ? event.error.message : event.message;
        var errorBox = document.getElementById('fatal-error');
        if (errorBox && message) {
          errorBox.textContent = 'Score Review could not start: ' + message;
          errorBox.hidden = false;
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var message =
          event.reason && event.reason.message ? event.reason.message : String(event.reason || 'Unknown error');
        var errorBox = document.getElementById('fatal-error');
        if (errorBox) {
          errorBox.textContent = 'Score Review could not continue: ' + message;
          errorBox.hidden = false;
        }
      });
    </script>
    <div id="app"></div>

    <script>
      /*__SWEET_SPOT_SCRIPT__*/
    </script>
  </body>
</html>
