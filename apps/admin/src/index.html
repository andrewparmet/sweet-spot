<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17352f" />
    <title>Sweet Spot Admin</title>
    <style>
      /*__SWEET_SPOT_STYLES__*/
    </style>
  </head>
  <body>
    <main id="login-shell" class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-heading">
          <div class="ball" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">Staging</p>
            <h1 id="login-title">Score Review</h1>
          </div>
        </div>
        <p class="login-copy">Sign in with an RTO match administrator account.</p>
        <form id="login-form" novalidate>
          <label>
            <span>RTO number or email</span>
            <input id="identifier" name="identifier" autocomplete="username" required />
          </label>
          <label>
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <div id="login-error" class="login-error" role="alert" hidden></div>
          <button id="login-button" class="primary-button" type="submit">Sign in</button>
        </form>
      </section>
    </main>

    <main id="admin-shell" class="page-shell" hidden>
      <header class="page-header">
        <div>
          <h1>Score Review</h1>
        </div>
        <div class="header-actions">
          <div class="environment">Staging</div>
          <button id="logout-button" class="text-button" type="button">Sign out</button>
        </div>
      </header>

      <section class="inbox" aria-label="Score queue">
        <div class="section-heading">
          <div class="queue-tabs" role="tablist" aria-label="Queue view">
            <button id="review-tab" type="button" role="tab" aria-selected="true">Needs review</button>
            <button id="history-tab" type="button" role="tab" aria-selected="false">History</button>
          </div>
          <button id="refresh-button" type="button">Refresh</button>
        </div>
        <div id="queue-message" class="queue-message" role="status">Loading queue…</div>
        <div id="queue-list" class="queue-list"></div>
      </section>
    </main>

    <dialog id="review-dialog" aria-labelledby="dialog-title">
      <div class="dialog-shell">
        <div class="dialog-heading">
          <div>
            <h2 id="dialog-title">Review score</h2>
          </div>
          <button id="close-dialog" class="close-button" type="button" aria-label="Close">×</button>
        </div>
        <div id="dialog-loading" class="dialog-loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span id="loading-label">Loading player directory…</span>
        </div>
        <div id="dialog-content" hidden>
          <div id="dialog-match" class="dialog-match"></div>
          <label class="score-override" for="review-score">
            <span>Score</span>
            <input id="review-score" type="text" inputmode="numeric" autocomplete="off" maxlength="100" />
          </label>
          <div id="player-matches" class="player-matches"></div>
        </div>
        <div id="dialog-error" class="dialog-error" role="alert" hidden></div>
        <div id="dialog-actions" class="dialog-actions" hidden>
          <button id="cancel-dialog" class="secondary-button" type="button">Cancel</button>
          <button id="demo-submit" class="primary-button" type="button">Submit</button>
        </div>
      </div>
    </dialog>

    <script>
      /*__SWEET_SPOT_SCRIPT__*/
    </script>
  </body>
</html>
