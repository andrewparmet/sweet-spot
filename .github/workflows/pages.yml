name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - apps/pages/**
      - apps/intake/src/**
      - packages/shared/**
      - apps/admin/.deployment.production-id
      - apps/admin/.deployment.staging-id
      - apps/intake/.deployment.production-id
      - apps/intake/.deployment.staging-id
      - package-lock.json
      - package.json
      - tools/build-pages.ts
      - tools/build.ts
      - tools/components.ts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build:pages
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/pages/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
